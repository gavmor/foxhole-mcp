# Release: build and publish foxhole-mcp to PyPI, then cut a GitHub release.
#
# Trigger: push a tag like `v0.1.0`. The tag MUST match `project.version`
# in pyproject.toml (the version-check job enforces this).
#
# One-time PyPI setup (trusted publishing, no API token needed):
#   1. On https://pypi.org/manage/project/foxhole-mcp/settings/publishing/
#      add a pending publisher: owner `gavmor`, repo `foxhole-mcp`,
#      workflow `release.yml`, environment left blank.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # PyPI trusted publishing (OIDC)

jobs:
  version-check:
    name: Tag matches pyproject version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag against project.version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=v$TAG pyproject=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $VER"
            exit 1
          fi

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: [version-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: python -m pytest

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
