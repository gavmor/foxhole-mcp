[project]
name = "foxhole-mcp"
version = "0.1.0"
description = "Custom Foxhole MediaWiki MCP Server & CLI with structured game data parsing"
readme = "README.md"
authors = [
    { name = "Gavin Morgan", email = "hello@gavmor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.0.0",
    "numpy>=2.5.3",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp>=1.45.0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.10.0",
    "scipy>=1.14",
    "wikitextparser>=2.0.0",
]

[project.optional-dependencies]
# Read Foxhole .sav files directly (foxhole-stockpiles' Rust parser)
stockpiles = ["fs-sav>=0.3.0"]

[project.scripts]
foxhole = "foxhole.cli:main"
# Alias matching the distribution name so `pipx run foxhole-mcp` works with no extra flags
foxhole-mcp = "foxhole.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# Distribution name is foxhole-mcp, but the import package stays `foxhole`
[tool.uv.build-backend]
module-name = "foxhole"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Agent tooling, not project code (see [tool.ty.src])
extend-exclude = [".agents", "skills", ".claude"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line-too-long handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.src]
# Agent tooling, not project code: skills installed by `npx skills` (.agents, symlinked into
# skills/ and .claude/skills) ship third-party templates, and agent git worktrees under
# .claude are full repo copies
exclude = [".agents", "skills", ".claude"]
